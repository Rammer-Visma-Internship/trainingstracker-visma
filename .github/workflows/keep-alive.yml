name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC on Mondays and Thursdays (every ~3-4 days to stay well under the 7-day limit)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows you to trigger this manually from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/system_config?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
